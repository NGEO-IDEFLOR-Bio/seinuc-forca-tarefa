editor: source

execute:
  cache: false
  freeze: false
  echo: false

project:
  type: book
  output-dir: pdf
  render: [index.qmd]
  pre-render: "R/.pre-render.R"
  post-render: "R/.post-render.R"

filters:
  - latex-environment

commands:
  - legend
  - legendleft

book:
  title: "Estruturação do Sistema Estadual de Informações sobre Unidades de Conservação (SEINUC/PA)"
  author: 
    - "Samuel da Costa dos Santos"
    - "Marcus Vinicius Silva da Silva"
    - "Elberth Gonçalves Sales"
  date: today
  date-format: "DD/MM/YYYY"
  submitted: 2024
  keyword: >-
    IDEFLOR-Bio, SEINUC, Unidades de Conservação, Geotecnologias, Gestão Ambiental
  language: pt-br
  license: "CC BY-NC-SA 4.0"
  publisher: "IDEFLOR-Bio"
  publisher-place: "Belém, Pará"
  favicon: images/logo.svg
  chapters:
    - index.qmd
    - qmd/vernacular-abstract.qmd
    - qmd/development.qmd
    - qmd/conclusion.qmd
  appendices:
    - qmd/appendix-1.qmd
    - qmd/annex-1.qmd

format:
  abnt-pdf:
    lang: pt-br
    babel-lang: brazil
    papersize: a4
    sides: oneside
    # Fontes comentadas - usando fontes padrão do LaTeX
    # Para usar Noto Sans, instale as fontes no sistema primeiro:
    # https://fonts.google.com/noto/specimen/Noto+Sans
    # mainfont: Noto-Sans
    # sansfont: Noto-Sans
    # monofont: Noto-Sans-Mono
    mainfont: "Times New Roman"
    sansfont: "Arial"
    monofont: "Courier New"
    fontsize: 12pt
    linestretch: 1.5
    parindent: 1cm
    parskip: 0ex
    frenchspacing: true
    biblatexoptions:
      - backend=biber
      - url=true
      - useprefix=false
      - giveninits=true
      - style=abnt
    bibhang: 0cm
    bibparsep: -2ex
    biblio-footnote: >
      Segundo normas da ABNT (NBR 6023).
    index-page: true
    colorlinks: true
    linkcolor: blue
    filecolor: blue
    citecolor: blue
    urlcolor: blue
    location: "Belém, PA"
    type-of-work: "Relatório Técnico"
    university: "Instituto de Desenvolvimento Florestal e da Biodiversidade do Estado do Pará"
    school: "Núcleo de Geotecnologias (NUGEO)"
    program: "Implementação do SEINUC/PA"
    version-note: "Versão 1.0 - Planejamento"
    include-in-header: "tex/include-in-header.tex"
    include-before-body: "tex/include-before-body.tex"
    include-after-body: "tex/include-after-body.tex"

citation:
  type: document

google-scholar: true
bibliography: references.bib